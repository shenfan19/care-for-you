<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Care for You</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="gate" class="gate" style="display:none"></div>
<div id="app" style="display:none">
  <header>
    <h1>Care for You</h1>
    <span class="mute" id="verTxt"></span>
    <span class="tools">
      <span id="elapsed" class="mute"></span>
      <span id="nowClock" class="clock"></span>
      <button id="peopleBtn" data-i18n="hdr.people" data-i18n-title="hdr.people_tip"></button>
      <select id="langSel" data-i18n-title="hdr.lang_tip"></select>
      <button id="themeBtn" class="icon" data-i18n-title="hdr.theme_tip">◐</button>
      <span id="clockTag" class="fftag"></span><button id="backRealBtn" style="display:none"></button><select id="ffSel"></select>
      <select id="ratioSel"></select>
      <button id="floatBtn" data-i18n="hdr.float" data-i18n-title="hdr.float_tip"></button>
      <button id="shareBtn" class="icon" data-i18n-title="hdr.share">🖼</button>
      <button id="dlBtn" data-i18n="hdr.save" data-i18n-title="hdr.save_tip"></button>
      <button id="gearBtn" class="icon" data-i18n-title="hdr.settings">⚙</button>
      <button id="aboutBtn" class="icon" data-i18n-title="hdr.about">ⓘ</button>
    </span>
  </header>
  <main>
    <div id="modeToast" class="card" style="display:none"></div>
    <div id="lifeBar" class="lifebar" style="display:none"></div>
    <div id="roomSlot"><div id="room" class="room"></div></div>
    <div id="floatNote" class="card" style="display:none"><span data-i18n="float.note"></span> <button id="unfloatBtn" data-i18n="float.back"></button></div>
    <div id="roomBar" class="row bar2"></div>
    <section id="feed"></section>
    <section id="said"></section>
    <footer class="foot mute"><span id="footTxt"></span> <a href="#" id="footAbout" data-i18n="hdr.about"></a></footer>
  </main>
</div>
<div id="modal" class="modal"></div>
<script src="vendor/js-yaml.min.js"></script>

<script src="src/i18n.js"></script>

<script src="src/content_en.js"></script>
<script src="src/content_react.js"></script>
<script src="locales/content_zh-TW.js"></script>
<script src="locales/content_ja.js"></script>
<script src="locales/content_ko.js"></script>
<script src="locales/content_fr.js"></script>
<script src="locales/content_es.js"></script>
<script src="locales/content_de.js"></script>
<script src="src/seed.js"></script>

</body>
