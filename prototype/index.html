<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Care for You</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="gate" class="gate" style="display:none"></div>
<div id="app" style="display:none">
  <header>
    <h1>Care for You</h1>
    <span class="mute">原型 v0.3</span>
    <span class="tools">
      <span id="clockTxt" class="mute"></span>
      <select id="timeMode" title="时间流逝"><option value="real">真实时间</option><option value="compressed">压缩时间</option><option value="paused">暂停</option></select>
      <button id="floatBtn" title="把角色浮出成一个置顶小窗">浮出小窗</button>
      <button id="dlBtn" title="下载全部数据">下载</button>
      <button id="gearBtn" title="设置" class="icon">⚙</button>
    </span>
  </header>
  <main>
    <div id="roomSlot"><div id="room" class="room"></div></div>
    <div id="floatNote" class="card" style="display:none">角色现在在浮出的小窗里。<button id="unfloatBtn">收回到这里</button></div>
    <div id="roomBar" class="row bar2"></div>
    <section id="feed"></section>
    <section id="said"></section>
  </main>
</div>
<div id="modal" class="modal"></div>
<script src="vendor/js-yaml.min.js"></script>
<script src="src/ini.js"></script>
<script src="src/store.js"></script>
<script src="src/content.js"></script>
<script src="src/seed.js"></script>
<script src="src/ai.js"></script>
<script src="src/game.js"></script>
<script src="src/avatar.js"></script>
<script src="src/ui_room.js"></script>
<script src="src/ui_home.js"></script>
<script src="src/main.js"></script>
</body>
</html>
