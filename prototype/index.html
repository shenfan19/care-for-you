<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Care for You</title>
<meta name="description" content="A quiet game about looking after the people, pets and plants at home. No score, no pressure, everything stays on your device.">
<meta name="theme-color" content="#c8794a">
<link rel="icon" href="favicon.svg" type="image/svg+xml">

<noscript><p style="padding:24px;font:16px system-ui">Care for You needs JavaScript to run. 需要启用 JavaScript 才能运行。</p></noscript>
<div id="gate" class="gate" style="display:none"></div>
<div id="app" style="display:none">
  <header>
    <h1 class="brand"><svg class="mark" viewBox="0 0 48 48" aria-hidden="true"><path d="M24 38 C8 28 8 14 17 12 C21 11 23 14 24 16 C25 14 27 11 31 12 C40 14 40 28 24 38Z" fill="var(--accent)"/><path d="M6 30 Q10 42 24 44 Q38 42 42 30" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linecap="round" opacity=".55"/><circle cx="24" cy="24" r="3.4" fill="var(--card)"/></svg><span>Care <em>for</em> You</span></h1>
    <span class="tools">
      <button id="peopleBtn" class="icon" aria-label="People" data-i18n-title="hdr.people_tip">👥</button>
      <button id="shareBtn" class="icon" data-i18n-title="hdr.share">🖼</button>
      <button id="floatBtn" class="icon" aria-label="Pop out" data-i18n-title="hdr.float_tip">⧉</button>
      <button id="gearBtn" class="icon" data-i18n-title="hdr.settings">⚙</button>
      <button id="aboutBtn" class="icon" data-i18n-title="hdr.about">ⓘ</button>
    </span>
  </header>
  <main>
    <div id="modeToast" class="card" style="display:none"></div>
    <div id="roomSlot"><div id="room" class="room"></div></div>
    <div id="floatNote" class="card" style="display:none"><span data-i18n="float.note"></span> <button id="unfloatBtn" data-i18n="float.back"></button></div>
    <div id="roomBar" class="row bar2"></div>
    <section id="feed"></section>
    <section id="said"></section>
    <footer class="foot mute"><span id="footTxt"></span> <a href="#" id="footAbout" data-i18n="hdr.about"></a></footer>
  </main>
</div>
<div id="modal" class="modal"></div>
