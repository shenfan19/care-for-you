<!doctype html><meta charset="utf-8"><title>动画取帧舞台</title>
<link rel="stylesheet" href="../style.css">
<style>body{margin:0;background:#fffdf8}#stage{width:200px;height:250px;position:relative;background:#fffdf8;overflow:hidden}.cx{position:absolute;left:32px;top:30px;width:136px;cursor:default}</style>
<div id="stage"></div>
<script src="../vendor/js-yaml.min.js"></script><script src="../src/meta.js"></script><script src="../src/i18n.js"></script><script src="../src/ini.js"></script><script src="../src/content.js"></script><script src="../src/game.js"></script><script src="../src/avatar.js"></script><script src="../src/ui_room.js"></script>
<script>
/* 用来从真实渲染里取动画帧，做展示用的 GIF。setScene 搭好场景，seek 把所有动画跳到某一时刻。 */
window.setScene = function (who, act, calling) {
  const C = CY.content, a = C.archOf(who);
  const p = { species: { id: a.species }, state: { mood: 0.8 }, person: { age_stage: a.age_stage, appearance: a.look, name: '' } };
  const st = document.getElementById('stage');
  st.innerHTML = `<div class="cx ${calling ? 'calling' : ''}" ${act ? `data-fx="${act}"` : ''}><div class="body">${CY.avatar(p)}</div><div class="fx">${act ? CY.ui.fxMarkup(act, a.species) : ''}</div></div>`;
  return true;
};
window.seek = function (ms) { document.getAnimations().forEach(x => { x.pause(); x.currentTime = ms; }); return true; };
</script>
