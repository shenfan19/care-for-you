# 角色卡源文件，一类典型角色一个文件，由 tools/build_cards.js 打包进 src/data/cards_packed.js。
# 标识类字段（id，group，species，voice，pronoun，look 的取值）只写英文编码；label 按语言写成对象，八种语言都在这里。
# order 是添加角色列表里的先后；pronoun 是 he，she 或 it；health，help，prefs，dialogue 是在原型默认值之上的覆盖。
id: wheelchair_user
order: 400
group: family
label:
  zh-CN: 坐轮椅的家人
  en: A family member in a wheelchair
  zh-TW: 坐輪椅的家人
  ja: 車いすの家族
  ko: 휠체어를 타는 가족
  fr: Un proche en fauteuil roulant
  es: Un familiar en silla de ruedas
  de: Ein Angehöriger im Rollstuhl
species: human
age: 68
voice: elder
pronoun: he
look:
  skin: 1
  hair_style: short
  hair_color: gray
  glasses: square
  beard: true
  cloth: '#6f8fa0'
