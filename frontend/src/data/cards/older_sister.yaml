# order 是添加角色列表里的先后；pronoun 是 he，she 或 it；health，help，prefs，dialogue 是在原型默认值之上的覆盖。
id: older_sister
order: 100
group: family
label:
  zh-CN: 姐姐
  en: Sister
  zh-TW: 姐姐
  ja: 姉・妹
  ko: 자매
  fr: Sœur
  es: Hermana
  de: Schwester
species: human
age: 26
voice: sibling
pronoun: she
look:
  skin: 1
  hair_style: ponytail
  hair_color: black
  glasses: none
  beard: false
  cloth: '#b5677a'
