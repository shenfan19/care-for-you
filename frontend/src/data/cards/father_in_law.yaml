  ko: 시아버지
  fr: Beau-père
  es: Suegro
  de: Schwiegervater
species: human
age: 72
voice: elder
pronoun: he
look:
  skin: 1
  hair_style: bald
  hair_color: gray
  glasses: square
  beard: false
  cloth: '#6f7f8f'
