# 角色卡源文件，一类典型角色一个文件，由 tools/build_cards.js 打包进 src/data/cards_packed.js。
# 标识类字段（id，group，species，voice，pronoun，look 的取值）只写英文编码；label 按语言写成对象，八种语言都在这里。
# order 是添加角色列表里的先后；pronoun 是 he，she 或 it；health，help，prefs，dialogue 是在原型默认值之上的覆盖。
id: older_brother
order: 90
group: family
label:
  zh-CN: 哥哥
  en: Brother
  zh-TW: 哥哥
  ja: 兄・弟
  ko: 형제
  fr: Frère
  es: Hermano
  de: Bruder
species: human
age: 28
voice: sibling
pronoun: he
look:
  skin: 1
  hair_style: short
  hair_color: black
  glasses: none
  beard: false
  cloth: '#4f6d8f'
