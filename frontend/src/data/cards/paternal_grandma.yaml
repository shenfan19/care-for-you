# order 是添加角色列表里的先后；pronoun 是 he，she 或 it；health，help，prefs，dialogue 是在原型默认值之上的覆盖。
id: paternal_grandma
order: 20
group: family
label:
  zh-CN: 奶奶
  en: Grandma
  zh-TW: 奶奶
  ja: おばあちゃん
  ko: 할머니
  fr: Grand-mère
  es: Abuela
  de: Oma
species: human
age: 72
voice: elder
pronoun: she
look:
  skin: 1
  hair_style: bun
  hair_color: gray
  glasses: none
  beard: false
  cloth: '#b58aa5'
