# 角色卡源文件，一类典型角色一个文件，由 tools/build_cards.js 打包进 src/data/cards_packed.js。
# 标识类字段（id，group，species，voice，pronoun，look 的取值）只写英文编码；label 按语言写成对象，八种语言都在这里。
# order 是添加角色列表里的先后；pronoun 是 he，she 或 it；health，help，prefs，dialogue 是在原型默认值之上的覆盖。
id: toddler_4
order: 590
group: family
label:
  zh-CN: 4岁孩子
  en: 4-year-old
  zh-TW: 4歲孩子
  ja: 4歳の子
  ko: 4살 아이
  fr: Enfant de 4 ans
  es: Niño de 4 años
  de: 4-jähriges Kind
species: human
age: 4
voice: child
pronoun: he
look:
  skin: 0
  hair_style: short
  hair_color: brown
  glasses: none
  beard: false
  cloth: '#e0b062'
dialogue:
  lines:
    request: {hunger: ['{title}，我要吃饭，我自己吃。']}
