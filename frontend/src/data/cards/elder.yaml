# 角色卡源文件，一类典型角色一个文件，由 tools/build_cards.js 打包进 src/data/cards_packed.js。
# 标识类字段（id，group，species，voice，pronoun，look 的取值）只写英文编码；label 按语言写成对象，八种语言都在这里。
# order 是添加角色列表里的先后；pronoun 是 he，she 或 it；health，help，prefs，dialogue 是在原型默认值之上的覆盖。
id: elder
order: 550
group: family
label:
  zh-CN: 典型老人
  en: Typical elder
  zh-TW: 典型老人
  ja: 典型的なお年寄り
  ko: 전형적인 노인
  fr: Personne âgée typique
  es: Persona mayor típica
  de: Typische ältere Person
species: human
age: 75
voice: elder
pronoun: he
look:
  skin: 1
  hair_style: short
  hair_color: gray
  glasses: round
  beard: false
  cloth: '#7f8f9a'
health:
  score: 0.6
dialogue:
  lines:
    request: {thirst: [……有点渴，倒杯水吧。], rest: [我坐一会儿，不碍事。]}
    thanks: {default: [好，好，难为你了。]}
