# 角色卡源文件，一类典型角色一个文件，由 tools/build_cards.js 打包进 src/data/cards_packed.js。
# 标识类字段（id，group，species，voice，pronoun，look 的取值）只写英文编码；label 按语言写成对象，八种语言都在这里。
# order 是添加角色列表里的先后；pronoun 是 he，she 或 it；health，help，prefs，dialogue 是在原型默认值之上的覆盖。
id: roommate
order: 150
group: family
label:
  zh-CN: 室友
  en: Roommate
  zh-TW: 室友
  ja: ルームメイト
  ko: 룸메이트
  fr: Colocataire
  es: Compañero de piso
  de: Mitbewohner
species: human
age: 25
voice: sibling
pronoun: he
look:
  skin: 1
  hair_style: curly
  hair_color: brown
  glasses: round
  beard: false
  cloth: '#6aa08f'
