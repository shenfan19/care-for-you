# 角色卡源文件，一类典型角色一个文件，由 tools/build_cards.js 打包进 src/data/cards_packed.js。
# 标识类字段（id，group，species，voice，pronoun，look 的取值）只写英文编码；label 按语言写成对象，八种语言都在这里。
# order 是添加角色列表里的先后；pronoun 是 he，she 或 it；health，help，prefs，dialogue 是在原型默认值之上的覆盖。
id: toddler_2
order: 570
group: family
label:
  zh-CN: 2岁孩子
  en: 2-year-old
  zh-TW: 2歲孩子
  ja: 2歳の子
  ko: 2살 아이
  fr: Enfant de 2 ans
  es: Niño de 2 años
  de: 2-jähriges Kind
species: human
age: 2
voice: toddler
pronoun: she
look:
  skin: 0
  hair_style: bun
  hair_color: brown
  glasses: none
  beard: false
  cloth: '#e7a6a1'
dialogue:
  lines:
    request: {hunger: [饿饿。]}
