# 角色卡源文件，一类典型角色一个文件，由 tools/build_cards.js 打包进 src/data/cards_packed.js。
# 标识类字段（id，group，species，voice，pronoun，look 的取值）只写英文编码；label 按语言写成对象，八种语言都在这里。
# order 是添加角色列表里的先后；pronoun 是 he，she 或 it；health，help，prefs，dialogue 是在原型默认值之上的覆盖。
id: toddler_3
order: 580
group: family
label:
  zh-CN: 3岁孩子
  en: 3-year-old
  zh-TW: 3歲孩子
  ja: 3歳の子
  ko: 3살 아이
  fr: Enfant de 3 ans
  es: Niño de 3 años
  de: 3-jähriges Kind
species: human
age: 3
voice: toddler
pronoun: he
look:
  skin: 0
  hair_style: short
  hair_color: black
  glasses: none
  beard: false
  cloth: '#8fbf9f'
dialogue:
  lines:
    request: {hunger: ['{title}，我饿了。']}
