# 角色卡源文件，一类典型角色一个文件，由 tools/build_cards.js 打包进 src/data/cards_packed.js。
# 标识类字段（id，group，species，voice，pronoun，look 的取值）只写英文编码；label 按语言写成对象，八种语言都在这里。
# order 是添加角色列表里的先后；pronoun 是 he，she 或 it；health，help，prefs，dialogue 是在原型默认值之上的覆盖。
id: child_12
order: 600
group: family
label:
  zh-CN: 12岁孩子
  en: 12-year-old
  zh-TW: 12歲孩子
  ja: 12歳の子
  ko: 12살 아이
  fr: Enfant de 12 ans
  es: Niño de 12 años
  de: 12-jähriges Kind
species: human
age: 12
voice: child
pronoun: she
look:
  skin: 1
  hair_style: ponytail
  hair_color: black
  glasses: none
  beard: false
  cloth: '#7aa5b8'
help:
  proactive: true
  efficiency: 0.3
  interval:
    - 50
    - 80
dialogue:
  lines:
    request: {hunger: ['{title}，我饿了，有吃的吗？']}
    thanks: {default: [嗯！我也可以帮你。]}
