  zh-TW: 盆栽小樹
  ja: 鉢植えの木
  ko: 화분 나무
  fr: Arbre en pot
  es: Árbol en maceta
  de: Bäumchen im Topf
species: tree
age: 3
voice: plant
pronoun: it
look:
  coat: green
