# 角色卡源文件，一类典型角色一个文件，由 tools/build_cards.js 打包进 src/data/cards_packed.js。
# 标识类字段（id，group，species，voice，pronoun，look 的取值）只写英文编码；label 按语言写成对象，八种语言都在这里。
# order 是添加角色列表里的先后；pronoun 是 he，she 或 it；health，help，prefs，dialogue 是在原型默认值之上的覆盖。
id: paternal_grandpa
order: 10
group: family
label:
  zh-CN: 爷爷
  en: Grandpa
  zh-TW: 爺爺
  ja: おじいちゃん
  ko: 할아버지
  fr: Grand-père
  es: Abuelo
  de: Opa
species: human
age: 75
voice: elder
pronoun: he
look:
  skin: 1
  hair_style: bald
  hair_color: white
  glasses: round
  beard: false
  cloth: '#7f9580'
