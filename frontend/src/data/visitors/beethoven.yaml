t:
  name:
    zh-CN: 路德维希·范·贝多芬
    en: Ludwig van Beethoven
    zh-TW: 路德維希·範·貝多芬
    ja: ルートヴィヒ・ヴァン・ベートーヴェン
    ko: 루트비히 판 베토벤
    fr: Ludwig van Beethoven
    es: Ludwig van Beethoven
    de: Ludwig van Beethoven
  era:
    zh-CN: 十八至十九世纪，德国
    en: 18th-19th century, Germany
    zh-TW: 十八至十九世紀，德國
    ja: 18〜19世紀、ドイツ
    ko: 18~19세기, 독일
    fr: XVIIIe et XIXe siècles, Allemagne
    es: Siglos XVIII y XIX, Alemania
    de: 18. und 19. Jahrhundert, Deutschland
  souvenir:
    zh-CN: 一页谈话本的复印件
    en: A copy of a page from a conversation book
    zh-TW: 一頁談話本的影印件
    ja: 会話帳の一ページの写し
    ko: 대화 공책 한 쪽의 사본
    fr: Une copie d'une page d'un cahier de conversation
    es: Una copia de una página de un cuaderno de conversación
    de: Eine Kopie einer Seite aus einem Konversationsheft
  arrive_note:
    zh-CN: 路德维希·范·贝多芬推开大门走了进来，说想在这里住几天。
    en: Ludwig van Beethoven came in through the front door and asked to stay a few days.
    zh-TW: 路德維希·範·貝多芬推開大門走了進來，說想在這裡住幾天。
    ja: ルートヴィヒ・ヴァン・ベートーヴェンは玄関をくぐり、しばらく泊めてほしいと頼んだ。
    ko: 루트비히 판 베토벤은(는) 현관문을 지나 들어와 며칠 묵어도 되겠냐고 물었습니다.
    fr: Ludwig van Beethoven franchit la porte d'entrée et demanda à rester quelques jours.
    es: Ludwig van Beethoven cruzó la puerta principal y preguntó si podía quedarse unos días.
    de: Ludwig van Beethoven trat durch die Haustür und bat darum, ein paar Tage bleiben zu dürfen.
  ok_line:
    zh-CN: 他翻开新本子，点了点头。
    en: He opened the new notebook and nodded.
    zh-TW: 他翻開新本子，點了點頭。
    ja: 彼は新しいノートを開き、うなずいた。
    ko: 그는 새 공책을 펴 보고 고개를 끄덕였습니다.
    fr: Il ouvrit le nouveau carnet et hocha la tête.
    es: Abrió el cuaderno nuevo y asintió.
    de: Er schlug das neue Heft auf und nickte.
  leave_ok:
    zh-CN: 路德维希·范·贝多芬临走前留下一页谈话本的复印件，说：有人肯把话写给我，就不孤单。
    en: 'Before leaving, Ludwig van Beethoven left a copy of a page from a conversation book and said: When someone takes the trouble to write to me, I am not alone.'
    zh-TW: 路德維希·範·貝多芬臨走前留下一頁談話本的影印件，說：有人肯把話寫給我，就不孤單。
    ja: 帰る前に、ルートヴィヒ・ヴァン・ベートーヴェンは記念の品を残していった：会話帳の一ページの写し。そして言った。「誰かがわざわざ書いて話しかけてくれるなら、私は孤独ではない。」
    ko: '떠나기 전에 루트비히 판 베토벤은(는) 기념품을 남겼습니다: 대화 공책 한 쪽의 사본. 그리고 말했습니다. “누군가 수고를 들여 내게 글로 말해 주면, 나는 외롭지 않습니다.”'
    fr: 'Avant de partir, Ludwig van Beethoven laissa un souvenir : Une copie d''une page d''un cahier de conversation. Et dit : « Quand quelqu''un prend la peine de m''écrire, je ne suis pas seul. »'
    es: 'Antes de irse, Ludwig van Beethoven dejó un recuerdo: Una copia de una página de un cuaderno de conversación. Y dijo: «Cuando alguien se toma la molestia de escribirme, no estoy solo.»'
    de: 'Vor dem Abschied ließ Ludwig van Beethoven etwas zurück: Eine Kopie einer Seite aus einem Konversationsheft. Dazu sagte Ludwig van Beethoven: „Wenn sich jemand die Mühe macht, mir etwas aufzuschreiben, bin ich nicht allein.“'
  leave_miss:
    zh-CN: 路德维希·范·贝多芬道了谢，推开门回去了。
    en: Ludwig van Beethoven said thanks and went back through the door.
    zh-TW: 路德維希·範·貝多芬道了謝，推開門回去了。
    ja: ルートヴィヒ・ヴァン・ベートーヴェンはお礼を言い、扉をくぐって帰っていった。
    ko: 루트비히 판 베토벤은(는) 고맙다고 인사하고 문을 지나 돌아갔습니다.
    fr: Ludwig van Beethoven remercia et repassa la porte.
    es: Ludwig van Beethoven dio las gracias y volvió a cruzar la puerta.
    de: Ludwig van Beethoven bedankte sich und ging zurück durch die Tür.
  hint:
    - {zh-CN: 他指了指耳朵，摆摆手，示意你把想说的写下来。, en: 'He pointed to his ears, waved a hand, and gestured for you to write down what you wanted to say.', zh-TW: 他指了指耳朵，擺擺手，示意你把想說的寫下來。, ja: 彼は自分の耳を指さし、手を振って、言いたいことを書いてほしいと身ぶりで示した。, ko: '그는 자기 귀를 가리키고 손을 내저으며, 하고 싶은 말을 적어 달라고 몸짓했습니다.', fr: 'Il montra ses oreilles, fit un geste de la main et te fit signe d''écrire ce que tu voulais dire.', es: 'Señaló sus oídos, hizo un gesto con la mano y te indicó que escribieras lo que querías decir.', de: 'Er zeigte auf seine Ohren, winkte ab und deutete an, du solltest aufschreiben, was du sagen wolltest.'}
    - {zh-CN: 他随身带着一本小册子，翻得很旧。, en: 'He carried a small, well-worn booklet everywhere.', zh-TW: 他隨身帶著一本小冊子，翻得很舊。, ja: 彼はいつも、使い込まれた小さな手帳を持ち歩いていた。, ko: 그는 낡고 손때 묻은 작은 수첩을 늘 들고 다녔습니다., fr: Il portait partout un petit carnet très usé., es: Llevaba a todas partes un cuadernillo pequeño y muy usado., de: 'Er trug überallhin ein kleines, abgegriffenes Heft bei sich.'}
said:
  zh-CN: 所有的人，都将成为兄弟。
  en: All men shall become brothers.
  zh-TW: 所有的人，都將成為兄弟。
  ja: すべての人は兄弟となる。
  ko: 모든 인간은 형제가 되리라.
  fr: Tous les hommes deviendront frères.
  es: Todos los hombres serán hermanos.
  de: Alle Menschen werden Brüder.
