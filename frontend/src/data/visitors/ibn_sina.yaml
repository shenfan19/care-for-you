t:
  name:
    zh-CN: 伊本·西纳
    en: Ibn Sina
    zh-TW: 伊本·西納
    ja: イブン・シーナー
    ko: 이븐 시나
    fr: Ibn Sina (Avicenne)
    es: Ibn Sina
    de: Ibn Sina
  era:
    zh-CN: 十一世纪，波斯
    en: 11th century, Persia
    zh-TW: 十一世紀，波斯
    ja: 11世紀、ペルシャ
    ko: 11세기, 페르시아
    fr: XIe siècle, Perse
    es: Siglo XI, Persia
    de: 11. Jahrhundert, Persien
  souvenir:
    zh-CN: 一页手稿的复印件
    en: A copy of a manuscript page
    zh-TW: 一頁手稿的影印件
    ja: 手稿の一ページの写し
    ko: 수고 한 쪽의 사본
    fr: Une copie d'une page de manuscrit
    es: Una copia de una página de manuscrito
    de: Eine Kopie einer Manuskriptseite
  arrive_note:
    zh-CN: 伊本·西纳推开大门走了进来，说想在这里住几天。
    en: Ibn Sina came in through the front door and asked to stay a few days.
    zh-TW: 伊本·西納推開大門走了進來，說想在這裡住幾天。
    ja: イブン・シーナーは玄関をくぐり、しばらく泊めてほしいと頼んだ。
    ko: 이븐 시나은(는) 현관문을 지나 들어와 며칠 묵어도 되겠냐고 물었습니다.
    fr: Ibn Sina (Avicenne) franchit la porte d'entrée et demanda à rester quelques jours.
    es: Ibn Sina cruzó la puerta principal y preguntó si podía quedarse unos días.
    de: Ibn Sina trat durch die Haustür und bat darum, ein paar Tage bleiben zu dürfen.
  ok_line:
    zh-CN: 他认真地检查了东西，点点头。
    en: He examined it carefully and nodded.
    zh-TW: 他認真地檢查了東西，點點頭。
    ja: 彼はそれを丁寧に調べて、うなずいた。
    ko: 그는 그것을 꼼꼼히 살펴보고 고개를 끄덕였습니다.
    fr: Il l'examina soigneusement et hocha la tête.
    es: Lo examinó con cuidado y asintió.
    de: Er prüfte es sorgfältig und nickte.
  leave_ok:
    zh-CN: 伊本·西纳临走前留下一页手稿的复印件，说：医生的本分，是把知道的告诉后来人。
    en: 'Before leaving, Ibn Sina left a copy of a manuscript page and said: A physician''s duty is to pass on what he knows.'
    zh-TW: 伊本·西納臨走前留下一頁手稿的影印件，說：醫生的本分，是把知道的告訴後來人。
    ja: 帰る前に、イブン・シーナーは記念の品を残していった：手稿の一ページの写し。そして言った。「医者の務めは、知っていることを伝えることです。」
    ko: '떠나기 전에 이븐 시나은(는) 기념품을 남겼습니다: 수고 한 쪽의 사본. 그리고 말했습니다. “의사의 의무는 아는 것을 전하는 것입니다.”'
    fr: 'Avant de partir, Ibn Sina (Avicenne) laissa un souvenir : Une copie d''une page de manuscrit. Et dit : « Le devoir d''un médecin est de transmettre ce qu''il sait. »'
    es: 'Antes de irse, Ibn Sina dejó un recuerdo: Una copia de una página de manuscrito. Y dijo: «El deber de un médico es transmitir lo que sabe.»'
    de: 'Vor dem Abschied ließ Ibn Sina etwas zurück: Eine Kopie einer Manuskriptseite. Dazu sagte Ibn Sina: „Die Pflicht eines Arztes ist es, weiterzugeben, was er weiß.“'
  leave_miss:
    zh-CN: 伊本·西纳道了谢，推开门回去了。
    en: Ibn Sina said thanks and went back through the door.
    zh-TW: 伊本·西納道了謝，推開門回去了。
    ja: イブン・シーナーはお礼を言い、扉をくぐって帰っていった。
    ko: 이븐 시나은(는) 고맙다고 인사하고 문을 지나 돌아갔습니다.
    fr: Ibn Sina (Avicenne) remercia et repassa la porte.
    es: Ibn Sina dio las gracias y volvió a cruzar la puerta.
    de: Ibn Sina bedankte sich und ging zurück durch die Tür.
  hint:
    - {zh-CN: 他在翻你的书架，说好书比什么药都让人安心。, en: 'He was leafing through your shelves, saying a good book can reassure a person more than any medicine.', zh-TW: 他在翻你的書架，說好書比什麼藥都讓人安心。, ja: 彼はあなたの本棚をめくりながら、良い本はどんな薬よりも人を安心させると言った。, ko: '그는 당신의 책장을 넘겨 보며, 좋은 책은 어떤 약보다 사람을 안심시킨다고 말했습니다.', fr: Il feuilletait tes étagères en disant qu'un bon livre peut rassurer une personne mieux que n'importe quel remède., es: Hojeaba tus estantes y dijo que un buen libro puede tranquilizar a una persona más que cualquier medicina., de: 'Er blätterte in deinen Regalen und sagte, ein gutes Buch könne einen Menschen mehr beruhigen als jede Medizin.'}
    - {zh-CN: 他说想把见过的病症都记下来，留给后来的人。, en: He said he wanted to write down every illness he had seen for those who come after., zh-TW: 他說想把見過的病症都記下來，留給後來的人。, ja: 彼は、これまで診たすべての病気を、後に続く人のために書き残したいと言った。, ko: 그는 자신이 본 모든 병을 뒤에 오는 이들을 위해 적어 두고 싶다고 말했습니다., fr: Il dit qu'il voulait consigner chaque maladie qu'il avait vue pour ceux qui viendraient après lui., es: Dijo que quería dejar escrita cada enfermedad que había visto para los que vengan después., de: 'Er sagte, er wolle jede Krankheit, die er gesehen habe, für die Nachkommen aufschreiben.'}
said:
  zh-CN: 要真正了解一件事，就得知道它的缘由。
  en: To truly know a thing, you must know its causes.
  zh-TW: 要真正瞭解一件事，就得知道它的緣由。
  ja: 物事を本当に知るには、その原因を知らなければならない。
  ko: 어떤 것을 참으로 알려면 그 까닭을 알아야 한다.
  fr: Pour vraiment connaître une chose, il faut en connaître les causes.
  es: Para conocer de verdad una cosa, hay que conocer sus causas.
  de: Um eine Sache wirklich zu kennen, muss man ihre Ursachen kennen.
