  souvenir:
    zh-CN: 一页手稿的复印件
    en: A copy of a manuscript page
    zh-TW: 一頁手稿的影印件
    ja: 原稿の一ページの写し
    ko: 원고 한 쪽의 사본
    fr: Une copie d'une page de manuscrit
    es: Una copia de una página de manuscrito
    de: Eine Kopie einer Manuskriptseite
  arrive_note:
    zh-CN: 简·奥斯汀推开大门走了进来，说想在这里住几天。
    en: Jane Austen came in through the front door and asked to stay a few days.
    zh-TW: 簡·奧斯汀推開大門走了進來，說想在這裡住幾天。
    ja: ジェーン・オースティンは玄関をくぐり、しばらく泊めてほしいと頼んだ。
    ko: 제인 오스틴은(는) 현관문을 지나 들어와 며칠 묵어도 되겠냐고 물었습니다.
    fr: Jane Austen franchit la porte d'entrée et demanda à rester quelques jours.
    es: Jane Austen cruzó la puerta principal y preguntó si podía quedarse unos días.
    de: Jane Austen trat durch die Haustür und bat darum, ein paar Tage bleiben zu dürfen.
  ok_line:
    zh-CN: 她眉眼弯弯，把东西放在了小桌上。
    en: She smiled and set it on her little table.
    zh-TW: 她眉眼彎彎，把東西放在了小桌上。
    ja: 彼女は微笑み、それを自分の小さな机の上に置いた。
    ko: 그녀는 미소 지으며 그것을 자기의 작은 탁자 위에 올려놓았습니다.
    fr: Elle sourit et le posa sur sa petite table.
    es: Sonrió y lo puso sobre su mesita.
    de: Sie lächelte und stellte es auf ihren kleinen Tisch.
  leave_ok:
    zh-CN: 简·奥斯汀临走前留下一页手稿的复印件，说：小小的桌子，也能装下整个世界。
    en: 'Before leaving, Jane Austen left a copy of a manuscript page and said: Even a small table can hold the whole world.'
    zh-TW: 簡·奧斯汀臨走前留下一頁手稿的影印件，說：小小的桌子，也能裝下整個世界。
    ja: 帰る前に、ジェーン・オースティンは記念の品を残していった：原稿の一ページの写し。そして言った。「小さな机ひとつでも、世界をまるごと載せられます。」
    ko: '떠나기 전에 제인 오스틴은(는) 기념품을 남겼습니다: 원고 한 쪽의 사본. 그리고 말했습니다. “작은 탁자 하나로도 온 세상을 올려놓을 수 있습니다.”'
    fr: 'Avant de partir, Jane Austen laissa un souvenir : Une copie d''une page de manuscrit. Et dit : « Même une petite table peut porter le monde entier. »'
    es: 'Antes de irse, Jane Austen dejó un recuerdo: Una copia de una página de manuscrito. Y dijo: «Hasta una mesa pequeña puede sostener el mundo entero.»'
    de: 'Vor dem Abschied ließ Jane Austen etwas zurück: Eine Kopie einer Manuskriptseite. Dazu sagte Jane Austen: „Auch ein kleiner Tisch kann die ganze Welt tragen.“'
  leave_miss:
    zh-CN: 简·奥斯汀道了谢，推开门回去了。
    en: Jane Austen said thanks and went back through the door.
    zh-TW: 簡·奧斯汀道了謝，推開門回去了。
    ja: ジェーン・オースティンはお礼を言い、扉をくぐって帰っていった。
    ko: 제인 오스틴은(는) 고맙다고 인사하고 문을 지나 돌아갔습니다.
    fr: Jane Austen remercia et repassa la porte.
    es: Jane Austen dio las gracias y volvió a cruzar la puerta.
    de: Jane Austen bedankte sich und ging zurück durch die Tür.
  hint:
    - {zh-CN: 她把稿纸悄悄盖在吸墨纸下面，听见人来就藏起来。, en: She tucked her manuscript under a blotter whenever someone came near., zh-TW: 她把稿紙悄悄蓋在吸墨紙下面，聽見人來就藏起來。, ja: 彼女は、誰かが近づくたびに原稿を吸い取り紙の下に滑り込ませた。, ko: 그녀는 누가 가까이 올 때마다 원고를 압지 밑에 밀어 넣었습니다., fr: Elle glissait son manuscrit sous un buvard dès que quelqu'un s'approchait., es: Escondía su manuscrito bajo un secante cada vez que alguien se acercaba., de: 'Sie schob ihr Manuskript unter eine Schreibunterlage, sobald jemand näher kam.'}
    - {zh-CN: 她说一杯热茶和一小张桌子就够写出一章。, en: She said a hot cup of tea and a small table were enough for a chapter., zh-TW: 她說一杯熱茶和一小張桌子就夠寫出一章。, ja: 彼女は、熱いお茶と小さな机があれば一章は書けると言った。, ko: 그녀는 뜨거운 차 한 잔과 작은 탁자만 있으면 한 장을 쓸 수 있다고 말했습니다., fr: Elle dit qu'une tasse de thé chaud et une petite table suffisaient pour un chapitre., es: Dijo que una taza de té caliente y una mesita bastaban para un capítulo., de: 'Sie sagte, eine heiße Tasse Tee und ein kleiner Tisch genügten für ein Kapitel.'}
said:
  zh-CN: 要说真正的舒适，没有什么比待在家里更好。
  en: There is nothing like staying at home for real comfort.
  zh-TW: 要說真正的舒適，沒有什麼比待在家裡更好。
  ja: 本当の安らぎを求めるなら、家にいるのがいちばんだ。
  ko: 진짜 편안함을 원한다면 집에 있는 것만 한 것이 없다.
  fr: Rien ne vaut de rester chez soi pour un vrai confort.
  es: No hay nada como quedarse en casa para tener verdadera comodidad.
  de: Nichts geht über das Zuhausebleiben, wenn man echten Komfort will.
