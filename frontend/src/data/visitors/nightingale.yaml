  name:
    zh-CN: 弗洛伦斯·南丁格尔
    en: Florence Nightingale
    zh-TW: 弗洛倫斯·南丁格爾
    ja: フローレンス・ナイチンゲール
    ko: 플로렌스 나이팅게일
    fr: Florence Nightingale
    es: Florence Nightingale
    de: Florence Nightingale
  era:
    zh-CN: 十九世纪，英国
    en: 19th century, Britain
    zh-TW: 十九世紀，英國
