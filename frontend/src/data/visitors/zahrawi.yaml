    zh-CN: 一页器具图谱的复印件
    en: A copy of a page of instrument drawings
    zh-TW: 一頁器具圖譜的影印件
    ja: 器具の図の一ページの写し
    ko: 기구 도판 한 쪽의 사본
    fr: Une copie d'une page de dessins d'instruments
    es: Una copia de una página de dibujos de instrumentos
