  arrive_note:
    zh-CN: 李时珍推开大门走了进来，说想在这里住几天。
    en: Li Shizhen came in through the front door and asked to stay a few days.
    zh-TW: 李時珍推開大門走了進來，說想在這裡住幾天。
    ja: 李時珍は玄関をくぐり、しばらく泊めてほしいと頼んだ。
    ko: 이시진은(는) 현관문을 지나 들어와 며칠 묵어도 되겠냐고 물었습니다.
    fr: Li Shizhen franchit la porte d'entrée et demanda à rester quelques jours.
    es: Li Shizhen cruzó la puerta principal y preguntó si podía quedarse unos días.
    de: Li Shizhen trat durch die Haustür und bat darum, ein paar Tage bleiben zu dürfen.
  ok_line:
    zh-CN: 他把东西收好，又蹲回花盆前继续看。
    en: He put it away and crouched back by the flowerpot.
    zh-TW: 他把東西收好，又蹲回花盆前繼續看。
    ja: 彼はそれをしまい、また植木鉢のそばにしゃがみ込んだ。
    ko: 그는 그것을 거두고 다시 화분 곁에 쪼그려 앉았습니다.
    fr: Il le rangea et se raccroupit de nouveau près du pot de fleurs.
    es: Lo guardó y volvió a agacharse junto a la maceta.
    de: Er steckte es ein und hockte sich wieder neben den Blumentopf.
  leave_ok:
    zh-CN: 李时珍临走前留下一株药草的标本，说：草木各有各的用处，别小看它们。
    en: 'Before leaving, Li Shizhen left a pressed herb specimen and said: Every plant has its use. Never look down on them.'
    zh-TW: 李時珍臨走前留下一株藥草的標本，說：草木各有各的用處，別小看它們。
    ja: 帰る前に、李時珍は記念の品を残していった：押し草の標本。そして言った。「どの草にも役に立つところがある。決して見くびってはいけない。」
    ko: '떠나기 전에 이시진은(는) 기념품을 남겼습니다: 눌러 말린 풀 표본. 그리고 말했습니다. “풀마다 쓰임이 있습니다. 결코 얕보지 마세요.”'
    fr: 'Avant de partir, Li Shizhen laissa un souvenir : Un spécimen d''herbe pressée. Et dit : « Chaque plante a son usage. Ne les méprise jamais. »'
    es: 'Antes de irse, Li Shizhen dejó un recuerdo: Un ejemplar de hierba prensada. Y dijo: «Cada planta tiene su uso. Nunca las desprecies.»'
    de: 'Vor dem Abschied ließ Li Shizhen etwas zurück: Ein gepresstes Kräuterexemplar. Dazu sagte Li Shizhen: „Jede Pflanze hat ihren Nutzen. Verachte keine.“'
  leave_miss:
    zh-CN: 李时珍道了谢，推开门回去了。
    en: Li Shizhen said thanks and went back through the door.
    zh-TW: 李時珍道了謝，推開門回去了。
    ja: 李時珍はお礼を言い、扉をくぐって帰っていった。
    ko: 이시진은(는) 고맙다고 인사하고 문을 지나 돌아갔습니다.
    fr: Li Shizhen remercia et repassa la porte.
    es: Li Shizhen dio las gracias y volvió a cruzar la puerta.
    de: Li Shizhen bedankte sich und ging zurück durch die Tür.
  hint:
    - {zh-CN: 他蹲在花盆前，认真研究叶子的纹路。, en: 'He crouched by a flowerpot, closely studying the veins of a leaf.', zh-TW: 他蹲在花盆前，認真研究葉子的紋路。, ja: 彼は植木鉢のそばにしゃがみ込み、葉の脈をじっくり観察していた。, ko: 그는 화분 곁에 쪼그려 앉아 잎맥을 꼼꼼히 살폈습니다., fr: 'Il s''accroupit près d''un pot de fleurs, étudiant de près les nervures d''une feuille.', es: 'Se agachó junto a una maceta, estudiando de cerca las nervaduras de una hoja.', de: Er hockte neben einem Blumentopf und studierte genau die Adern eines Blattes.}
    - {zh-CN: 他说想认全天下的药草，一样一样记下来。, en: He said he wanted to know every medicinal herb under the sun and record them one by one., zh-TW: 他說想認全天下的藥草，一樣一樣記下來。, ja: 彼は、天の下のすべての薬草を知り、ひとつずつ記録したいと言った。, ko: 그는 하늘 아래 모든 약초를 알고 하나하나 기록하고 싶다고 말했습니다., fr: Il dit qu'il voulait connaître toutes les herbes médicinales sous le soleil et les consigner une à une., es: Dijo que quería conocer todas las hierbas medicinales bajo el sol y registrarlas una por una., de: 'Er sagte, er wolle jede Heilpflanze unter der Sonne kennen und eine nach der anderen aufzeichnen.'}
