    ja: 薬草の図の一ページの写し
    ko: 약초 그림 한 쪽의 사본
    fr: Une copie d'une page de dessins d'herbes
    es: Una copia de una página de dibujos de hierbas
    de: Eine Kopie einer Seite mit Kräuterzeichnungen
  arrive_note:
    zh-CN: 许浚推开大门走了进来，说想在这里住几天。
    en: Heo Jun came in through the front door and asked to stay a few days.
    zh-TW: 許浚推開大門走了進來，說想在這裡住幾天。
    ja: 許浚は玄関をくぐり、しばらく泊めてほしいと頼んだ。
    ko: 허준은(는) 현관문을 지나 들어와 며칠 묵어도 되겠냐고 물었습니다.
    fr: Heo Jun franchit la porte d'entrée et demanda à rester quelques jours.
    es: Heo Jun cruzó la puerta principal y preguntó si podía quedarse unos días.
    de: Heo Jun trat durch die Haustür und bat darum, ein paar Tage bleiben zu dürfen.
  ok_line:
    zh-CN: 他把毯子盖在膝上，点点头说，这样就暖和了。
    en: He laid the blanket over his knees and nodded; now it was warm.
    zh-TW: 他把毯子蓋在膝上，點點頭說，這樣就暖和了。
    ja: 彼は膝に毛布をかけてうなずいた。これで暖かい。
    ko: 그는 무릎에 담요를 덮고 고개를 끄덕였습니다. 이제 따뜻하군.
    fr: Il posa la couverture sur ses genoux et hocha la tête ; maintenant il faisait chaud.
    es: Se echó la manta sobre las rodillas y asintió; ahora estaba caliente.
    de: Er legte die Decke über die Knie und nickte; nun war es warm.
  leave_ok:
    zh-CN: 许浚临走前留下一页药草图的复印件，说：能让百姓看懂的医书，才是好医书。
    en: 'Before leaving, Heo Jun left a copy of a page of herb drawings and said: A medical book that ordinary people can read is a good one.'
    zh-TW: 許浚臨走前留下一頁藥草圖的影印件，說：能讓百姓看懂的醫書，才是好醫書。
    ja: 帰る前に、許浚は記念の品を残していった：薬草の図の一ページの写し。そして言った。「普通の人が読める医書こそ、よい医書だ。」
    ko: '떠나기 전에 허준은(는) 기념품을 남겼습니다: 약초 그림 한 쪽의 사본. 그리고 말했습니다. “백성이 읽을 수 있는 의서가 좋은 의서입니다.”'
    fr: 'Avant de partir, Heo Jun laissa un souvenir : Une copie d''une page de dessins d''herbes. Et dit : « Un livre de médecine que les gens ordinaires peuvent lire est un bon livre. »'
    es: 'Antes de irse, Heo Jun dejó un recuerdo: Una copia de una página de dibujos de hierbas. Y dijo: «Un libro de medicina que la gente común puede leer es un buen libro.»'
    de: 'Vor dem Abschied ließ Heo Jun etwas zurück: Eine Kopie einer Seite mit Kräuterzeichnungen. Dazu sagte Heo Jun: „Ein medizinisches Buch, das einfache Leute lesen können, ist ein gutes Buch.“'
  leave_miss:
    zh-CN: 许浚道了谢，推开门回去了。
    en: Heo Jun said thanks and went back through the door.
    zh-TW: 許浚道了謝，推開門回去了。
    ja: 許浚はお礼を言い、扉をくぐって帰っていった。
    ko: 허준은(는) 고맙다고 인사하고 문을 지나 돌아갔습니다.
    fr: Heo Jun remercia et repassa la porte.
    es: Heo Jun dio las gracias y volvió a cruzar la puerta.
    de: Heo Jun bedankte sich und ging zurück durch die Tür.
  hint:
    - {zh-CN: 他说药材要让普通人也认得出来，所以给每一味药都标上了本地的叫法。, en: 'He said medicinal plants should be recognisable to ordinary people, so he gave each one its local name.', zh-TW: 他說藥材要讓普通人也認得出來，所以給每一味藥都標上了本地的叫法。, ja: 彼は、薬草は普通の人にも見分けがつくべきだと言い、それぞれにその土地の呼び名を付けた。, ko: '그는 약재를 보통 사람도 알아볼 수 있어야 한다며, 약재마다 그 고장의 이름을 붙였다고 말했습니다.', fr: 'Il disait que les plantes médicinales devaient être reconnaissables par tous, et donna donc à chacune son nom local.', es: 'Dijo que las plantas medicinales debían ser reconocibles para la gente común, y por eso dio a cada una su nombre local.', de: 'Er sagte, Heilpflanzen sollten auch für einfache Leute erkennbar sein, und gab deshalb jeder ihren örtlichen Namen.'}
    - {zh-CN: 他说治病不如防病，平时把身体照顾好，才是最好的药。, en: 'He said preventing illness beats curing it, and looking after the body every day is the best medicine.', zh-TW: 他說治病不如防病，平時把身體照顧好，才是最好的藥。, ja: 彼は、治すより防ぐほうがよく、毎日体をいたわるのが最良の薬だと言った。, ko: '그는 고치는 것보다 막는 것이 낫고, 날마다 몸을 돌보는 것이 가장 좋은 약이라고 말했습니다.', fr: Il disait que prévenir vaut mieux que guérir et que prendre soin du corps chaque jour est le meilleur remède., es: Dijo que prevenir es mejor que curar y que cuidar el cuerpo cada día es la mejor medicina., de: 'Er sagte, Vorbeugen sei besser als Heilen, und den Körper täglich zu pflegen sei die beste Medizin.'}
