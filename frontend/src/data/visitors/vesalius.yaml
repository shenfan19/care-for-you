  souvenir:
    zh-CN: 一页解剖图的复印件
    en: A copy of a page of an anatomical plate
    zh-TW: 一頁解剖圖的影印件
    ja: 解剖図の一ページの写し
    ko: 해부도 한 쪽의 사본
    fr: Une copie d'une page d'une planche anatomique
    es: Una copia de una página de una lámina anatómica
