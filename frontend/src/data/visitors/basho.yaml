t:
  name:
    zh-CN: 松尾芭蕉
    en: Matsuo Basho
    zh-TW: 松尾芭蕉
    ja: 松尾芭蕉
    ko: 마쓰오 바쇼
    fr: Matsuo Bashō
    es: Matsuo Basho
    de: Matsuo Basho
  era:
    zh-CN: 江户时代，日本
    en: Edo period, Japan
    zh-TW: 江戶時代，日本
    ja: 江戸時代、日本
    ko: 에도 시대, 일본
    fr: Période d'Edo, Japon
    es: Período Edo, Japón
    de: Edo-Zeit, Japan
  souvenir:
    zh-CN: 一页俳句的复印件
    en: A copy of a page of haiku
    zh-TW: 一頁俳句的影印件
    ja: 俳句の一ページの写し
    ko: 하이쿠 한 쪽의 사본
    fr: Une copie d'une page de haïkus
    es: Una copia de una página de haikus
    de: Eine Kopie einer Haiku-Seite
  arrive_note:
    zh-CN: 松尾芭蕉推开大门走了进来，说想在这里住几天。
    en: Matsuo Basho came in through the front door and asked to stay a few days.
    zh-TW: 松尾芭蕉推開大門走了進來，說想在這裡住幾天。
    ja: 松尾芭蕉は玄関をくぐり、しばらく泊めてほしいと頼んだ。
    ko: 마쓰오 바쇼은(는) 현관문을 지나 들어와 며칠 묵어도 되겠냐고 물었습니다.
    fr: Matsuo Bashō franchit la porte d'entrée et demanda à rester quelques jours.
    es: Matsuo Basho cruzó la puerta principal y preguntó si podía quedarse unos días.
    de: Matsuo Basho trat durch die Haustür und bat darum, ein paar Tage bleiben zu dürfen.
  ok_line:
    zh-CN: 他穿上东西走了两步，笑着点头。
    en: He tried it on, took two steps, and nodded with a smile.
    zh-TW: 他穿上東西走了兩步，笑著點頭。
    ja: 彼はそれを履いてみて、二、三歩歩き、微笑んでうなずいた。
    ko: 그는 신어 보고 두어 걸음 걸어 보더니 미소 지으며 고개를 끄덕였습니다.
    fr: Il les essaya, fit deux pas et hocha la tête en souriant.
    es: Se las probó, dio dos pasos y asintió sonriendo.
    de: Er probierte sie an, tat zwei Schritte und nickte lächelnd.
  leave_ok:
    zh-CN: 松尾芭蕉临走前留下一页俳句的复印件，说：路上遇见的，都是诗。
    en: 'Before leaving, Matsuo Basho left a copy of a page of haiku and said: Everything you meet on the road is a poem.'
    zh-TW: 松尾芭蕉臨走前留下一頁俳句的影印件，說：路上遇見的，都是詩。
    ja: 帰る前に、松尾芭蕉は記念の品を残していった：俳句の一ページの写し。そして言った。「道で出会うものは、すべて詩だ。」
    ko: '떠나기 전에 마쓰오 바쇼은(는) 기념품을 남겼습니다: 하이쿠 한 쪽의 사본. 그리고 말했습니다. “길에서 만나는 모든 것이 시입니다.”'
    fr: 'Avant de partir, Matsuo Bashō laissa un souvenir : Une copie d''une page de haïkus. Et dit : « Tout ce que tu rencontres sur la route est un poème. »'
    es: 'Antes de irse, Matsuo Basho dejó un recuerdo: Una copia de una página de haikus. Y dijo: «Todo lo que encuentras en el camino es un poema.»'
    de: 'Vor dem Abschied ließ Matsuo Basho etwas zurück: Eine Kopie einer Haiku-Seite. Dazu sagte Matsuo Basho: „Alles, was dir unterwegs begegnet, ist ein Gedicht.“'
  leave_miss:
    zh-CN: 松尾芭蕉道了谢，推开门回去了。
    en: Matsuo Basho said thanks and went back through the door.
    zh-TW: 松尾芭蕉道了謝，推開門回去了。
    ja: 松尾芭蕉はお礼を言い、扉をくぐって帰っていった。
    ko: 마쓰오 바쇼은(는) 고맙다고 인사하고 문을 지나 돌아갔습니다.
    fr: Matsuo Bashō remercia et repassa la porte.
    es: Matsuo Basho dio las gracias y volvió a cruzar la puerta.
    de: Matsuo Basho bedankte sich und ging zurück durch die Tür.
  hint:
    - {zh-CN: 他低头看了看自己的草鞋，说路还长着呢。, en: He looked down at his straw sandals and said the road was still long., zh-TW: 他低頭看了看自己的草鞋，說路還長著呢。, ja: 彼は自分の草鞋を見下ろし、道はまだ長いと言った。, ko: 그는 자신의 짚신을 내려다보며 길이 아직 멀다고 말했습니다., fr: Il regarda ses sandales de paille et dit que la route était encore longue., es: Miró sus sandalias de paja y dijo que el camino aún era largo., de: 'Er blickte auf seine Strohsandalen und sagte, der Weg sei noch lang.'}
    - {zh-CN: 他说旅途中最好的是一杯热茶。, en: He said the best part of a journey is a hot cup of tea., zh-TW: 他說旅途中最好的是一杯熱茶。, ja: 彼は、旅でいちばんいいのは熱いお茶の一杯だと言った。, ko: 그는 여행에서 가장 좋은 것은 뜨거운 차 한 잔이라고 말했습니다., fr: 'Il dit que le meilleur d''un voyage, c''est une tasse de thé chaud.', es: Dijo que lo mejor de un viaje es una taza de té caliente., de: 'Er sagte, das Schönste an einer Reise sei eine Tasse heißen Tees.'}
said:
  zh-CN: 古池塘，青蛙跳进去，水声响。
  en: 'An old pond: a frog jumps in, the sound of water.'
  zh-TW: 古池塘，青蛙跳進去，水聲響。
  ja: 古池や　蛙飛びこむ　水の音。
  ko: 오래된 연못, 개구리가 뛰어드는 물소리.
  fr: 'Un vieil étang : une grenouille y saute, le bruit de l''eau.'
  es: 'Un viejo estanque: salta una rana, el sonido del agua.'
  de: 'Ein alter Teich: Ein Frosch springt hinein, das Geräusch des Wassers.'
