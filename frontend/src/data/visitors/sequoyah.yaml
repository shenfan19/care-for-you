    en: A copy of a page of a syllable chart
    zh-TW: 一頁音節表的影印件
    ja: 音節表の一ページの写し
    ko: 음절표 한 쪽의 사본
    fr: Une copie d'une page d'un tableau de syllabes
    es: Una copia de una página de una tabla de sílabas
