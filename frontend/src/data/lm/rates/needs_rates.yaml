# 需求的涨落：每个需求一个压力状态，速率和上限是输入，由游戏侧适配层按角色、时段、性格、照顾等算好后写进来，模型本身没有游戏的数。
# 压力在 0 到 1 之间，按速率每小时上涨，不超过上限；睡觉时的休息恢复用负速率表示。心情向 1 减斜率乘最大压力的目标松弛。
# 这是 LM 格式的通用模型，没有 drives，不属于任何疾病或身体模型，由 core_needs.js 单独载入。
metadata:
  name: needs_rates
  version: "1.0"
  lm_format_version: "1.0"
  description:
    problem: |
      一个角色的各项需求随时间累积，照顾让它回落，心情跟着最大的需求走。游戏里这些速率因角色、时段、性格、物品而不同。
    method: |
      - 每个需求的压力 p 每小时按输入速率上涨，取 0 到 1，再不超过输入上限。
      - 心情每小时向目标靠拢，目标是 1 减斜率乘最大压力再加偏移，靠拢的比例是步长乘松弛系数，最大为 1。
    limitations: |
      - 速率由适配层给，本模型不决定速率的大小。
      - 不含虚弱度的规则，那一条在游戏侧。
  ratings:
    importance: 0.5 - 游戏里每个角色都用
    variable: 0.25 - 速率与参数由适配层按游戏数据给
    equation: 0.25 - 线性累积加一阶松弛
    simulation: 0.25 - 与游戏内置的涨落逐位对比过
    optimization: 0.0 - 无决策目标
    confidence: 0.25 - 只是把已有规则换了载体

