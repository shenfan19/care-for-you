equations:
  need_rise:
    description: 每个需求的压力按速率涨，不超过上限，取 0 到 1。
    priority: 40
    step_unit: hour
    dynamics:
      p_bp: "max(0.0, min(1.0, min(cap_bp, p_bp + rate_bp * step)))"
      p_breath: "max(0.0, min(1.0, min(cap_breath, p_breath + rate_breath * step)))"
      p_chest: "max(0.0, min(1.0, min(cap_chest, p_chest + rate_chest * step)))"
      p_clean: "max(0.0, min(1.0, min(cap_clean, p_clean + rate_clean * step)))"
      p_company: "max(0.0, min(1.0, min(cap_company, p_company + rate_company * step)))"
      p_diaper: "max(0.0, min(1.0, min(cap_diaper, p_diaper + rate_diaper * step)))"
      p_fertilize: "max(0.0, min(1.0, min(cap_fertilize, p_fertilize + rate_fertilize * step)))"
      p_fever: "max(0.0, min(1.0, min(cap_fever, p_fever + rate_fever * step)))"
      p_homework: "max(0.0, min(1.0, min(cap_homework, p_homework + rate_homework * step)))"
      p_humid: "max(0.0, min(1.0, min(cap_humid, p_humid + rate_humid * step)))"
      p_hunger: "max(0.0, min(1.0, min(cap_hunger, p_hunger + rate_hunger * step)))"
      p_hygiene: "max(0.0, min(1.0, min(cap_hygiene, p_hygiene + rate_hygiene * step)))"
      p_itch: "max(0.0, min(1.0, min(cap_itch, p_itch + rate_itch * step)))"
      p_joint: "max(0.0, min(1.0, min(cap_joint, p_joint + rate_joint * step)))"
      p_lowmood: "max(0.0, min(1.0, min(cap_lowmood, p_lowmood + rate_lowmood * step)))"
      p_medicine: "max(0.0, min(1.0, min(cap_medicine, p_medicine + rate_medicine * step)))"
      p_mobility: "max(0.0, min(1.0, min(cap_mobility, p_mobility + rate_mobility * step)))"
      p_nightmare: "max(0.0, min(1.0, min(cap_nightmare, p_nightmare + rate_nightmare * step)))"
      p_pain: "max(0.0, min(1.0, min(cap_pain, p_pain + rate_pain * step)))"
      p_play: "max(0.0, min(1.0, min(cap_play, p_play + rate_play * step)))"
      p_prune: "max(0.0, min(1.0, min(cap_prune, p_prune + rate_prune * step)))"
      p_reorient: "max(0.0, min(1.0, min(cap_reorient, p_reorient + rate_reorient * step)))"
      p_rest: "max(0.0, min(1.0, min(cap_rest, p_rest + rate_rest * step)))"
      p_sneeze: "max(0.0, min(1.0, min(cap_sneeze, p_sneeze + rate_sneeze * step)))"
      p_sugar: "max(0.0, min(1.0, min(cap_sugar, p_sugar + rate_sugar * step)))"
      p_sun: "max(0.0, min(1.0, min(cap_sun, p_sun + rate_sun * step)))"
      p_thirst: "max(0.0, min(1.0, min(cap_thirst, p_thirst + rate_thirst * step)))"
      p_toilet: "max(0.0, min(1.0, min(cap_toilet, p_toilet + rate_toilet * step)))"
      p_tremor: "max(0.0, min(1.0, min(cap_tremor, p_tremor + rate_tremor * step)))"
      p_veg: "max(0.0, min(1.0, min(cap_veg, p_veg + rate_veg * step)))"
      p_warmth: "max(0.0, min(1.0, min(cap_warmth, p_warmth + rate_warmth * step)))"
      p_water: "max(0.0, min(1.0, min(cap_water, p_water + rate_water * step)))"
  mood_relax_dynamics:
    description: 心情向目标松弛。
    priority: 30
    step_unit: hour
    dynamics:
      mood_v: "mood_v + mood_on * (min(1.0, max(0.0, 1.0 - mood_slope * max(other_max, p_bp, p_breath, p_chest, p_clean, p_company, p_diaper, p_fertilize, p_fever, p_homework, p_humid, p_hunger, p_hygiene, p_itch, p_joint, p_lowmood, p_medicine, p_mobility, p_nightmare, p_pain, p_play, p_prune, p_reorient, p_rest, p_sneeze, p_sugar, p_sun, p_thirst, p_toilet, p_tremor, p_veg, p_warmth, p_water) + mood_shift)) - mood_v) * min(1.0, step * mood_relax)"
