metadata:
  name: cond_diabetes
  version: "1.1"
  lm_format_version: "1.0"
  condition: diabetes
  source: Care for You 手写的二型糖尿病基础模型，结构参照 Life Matters 的 diabetes 与 diabetes_core，数值按游戏的节奏取
  description:
    problem: |
      一个得了二型糖尿病的家人，餐后血糖上去，靠胰岛素敏感性和药把它压回来。照顾的人能做的是陪吃药，测血糖，晚饭时帮着选吃什么。
    method: |
      - 血糖 dm_glucose 受三餐碳水推高，按敏感性乘药效的速率回落到基线，基线里含肝脏每小时释放的一份。
      - 药效 dm_med 吃一次加 1，半衰期约十小时，药效越高敏感性越高。
      - 近三天平均 dm_avg 是血糖的慢平均，时间常数 72 小时，相当于游戏时间尺度上的糖化指标。
      - 长期负担 dm_strain 在平均血糖超过 150 时累积，缓慢恢复，只通过 effects 轻轻拉高虚弱度和压低心情。
      - 该测血糖了 dm_check_debt 是游戏里 sugar 需求的状态，平均血糖越高涨得越快。
    limitations: |
      - 没有胰岛素分泌的显式动力学，把分泌缺陷和敏感性下降合并进敏感性一个参数。
      - 没有低血糖，药效不会把血糖压到 70 以下。
      - 时间尺度是游戏时间，不是真实的月和年，长期并发症只用 dm_strain 一个指标表示。
  ratings:
    importance: 0.75 - 糖尿病是最常见的需要家人照看的慢病之一
    variable: 0.25 - 系数为经验取值
    equation: 0.25 - 一室线性清除加三餐输入
    simulation: 0.5 - 餐后峰值、空腹基线落在临床常见范围
    optimization: 0.0 - 无决策目标
    confidence: 0.25 - 方向合理，幅度未校准

parameters:
  dm_sens: 0.45
  dm_g0: 95.0
  dm_hgp: 12.0
  dm_k_carb: 2.0
  dm_k_clear: 0.6
  dm_med_gain: 0.8
  dm_tau_med_h: 14.0
  dm_tau_avg_h: 72.0
  dm_strain_thr: 150.0
  dm_k_strain: 0.004
  dm_k_heal: 0.002
  dm_k_check: 0.05
  dm_f_gain: 0.003
  dm_m_gain: 0.02

variables:
  dm_glucose:
    description: 血糖。
    value: 140.0
    unit: mg/dL
    type: state
    bounds: [70.0, 400.0]
  dm_med:
    description: 药效水平，吃一次药加 1。
    value: 0.5
    unit: index
    type: state
    bounds: [0.0, 1.5]
  dm_avg:
    description: 近三天平均血糖。
    value: 140.0
    unit: mg/dL
    type: state
    bounds: [70.0, 400.0]
  dm_strain:
    description: 长期负担，0 到 1。
    value: 0.0
    unit: fraction
    type: state
    bounds: [0.0, 1.0]
  dm_check_debt:
    description: 想测血糖的程度，对应游戏里的 sugar 需求。
    value: 0.2
    unit: fraction
    type: state
    bounds: [0.0, 1.0]
  dm_carbs:
    description: 碳水摄入，按每小时的量给。
    value: 0.0
    unit: g
    type: input

auxiliary:
  dm_sens_eff: "dm_sens * (1.0 + dm_med_gain * min(1.0, dm_med))"

equations:
  dm_glucose_dynamics:
    description: 碳水推高血糖，敏感性乘药效决定回落的速度。
    priority: 40
    step_unit: hour
    dynamics:
      dm_glucose: "dm_glucose + step * (max(0.0, dm_carbs) * dm_k_carb + dm_hgp - dm_k_clear * dm_sens_eff * (dm_glucose - dm_g0))"
  dm_med_dynamics:
    description: 药效指数衰减。
    priority: 41
    step_unit: hour
    dynamics:
      dm_med: "dm_med * exp(-step / dm_tau_med_h)"
  dm_avg_dynamics:
    description: 近三天平均血糖。
    priority: 39
    step_unit: hour
    dynamics:
      dm_avg: "dm_avg + (dm_glucose - dm_avg) * (1.0 - exp(-step / dm_tau_avg_h))"
  dm_strain_dynamics:
    description: 平均血糖超限时累积负担，平时慢慢恢复。
    priority: 38
    step_unit: hour
    dynamics:
      dm_strain: "dm_strain + step * (dm_k_strain * max(0.0, dm_avg - dm_strain_thr) / 100.0 - dm_k_heal * dm_strain)"
  dm_check_dynamics:
    description: 想测血糖的程度，睡觉时涨得慢，平均血糖高时涨得快。
    priority: 37
    step_unit: hour
    dynamics:
      dm_check_debt: "dm_check_debt + step * dm_k_check * speed_sugar * (1.0 + 1.5 * min(1.0, max(0.0, (dm_avg - 140.0) / 100.0))) * (1.0 - 0.7 * asleep)"
