version: 11
# routine 是真实生活的作息：起床 wake，睡觉 bed，午睡 nap，三餐 meals，洗澡 bath，单位小时，spread 是每个人偏离这张表的小时数上限。婴儿不在此列，按自己的节奏。
# 不同类别的人和动物在没人管的时候表现不同。婴儿完全不能自理，会哭闹，老人能自己吃饭睡觉，花草不会说话但会慢慢蔫掉。
